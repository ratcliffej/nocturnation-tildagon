# Tildagon app-store submission manifest.
#
# Read by the EMF app-store crawler when this repo is public and tagged
# with the `tildagon-app` GitHub topic; the app then appears at
# https://apps.badge.emfcamp.org/. Manifest schema reference:
# https://tildagon.badge.emfcamp.org/tildagon-apps/publish/
#
# Distinct from metadata.json, which is the on-badge runtime artefact the
# launcher uses to enumerate installed apps.

[app]
name = "NocturNation"
# Store category; one of: Badge, Music, Media, Apps, Games.
category = "Music"
# Legacy fallback for firmware predating the Music category ("Badge",
# "Music", or "Apps"); "Apps" is the catch-all bucket.
menu = "Apps"
# The app drives ESP-NOW directly and does not want a station-mode
# associate-to-AP step on launch. It manages the radio itself: WiFi stays
# up in the idle menu and is dropped (wifi.stop()) while a mode runs.
wifi_preference = false

[entry]
# Entry-point Application subclass, defined in app.py at the repo root
# (also exported there as `__app_export__ = NocturNationApp`).
class = "NocturNationApp"

[metadata]
author = "ratcliffej"
license = "MIT"
url = "https://github.com/ratcliffej/nocturnation-tildagon"
description = "Turn your badge into a Lume that pulses with the crowd in time to the music, or tap to run your own show. Open-source, no cloud."
# Monotonic version string; bump on every app-store release. The store
# schema requires a string here (a bare TOML integer is rejected by the
# crawler as "expected string, received bigint").
version = "14"
